[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Paris: no PUSH0/MCOPY, so the same bytecode runs on every EVM chain we target (and is closest to Tron's TVM)
evm_version = "paris"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
cbor_metadata = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[fuzz]
runs = 2000

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[fmt]
line_length = 120
